<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not in the deck &middot; Hour &amp; Sign</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,900&family=Space+Mono:wght@400&display=swap">
<style>
:root{--paper:#e7e4d8;--ink:#141e3c;--flare:#ff3f6b}
@media (prefers-color-scheme: dark){:root{--paper:#10131e;--ink:#eae7db;--flare:#ff5f82;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
     font-family:'Space Mono',ui-monospace,monospace;padding:0 max(16px,env(safe-area-inset-left,0px));text-align:center}
h1{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(2.4rem,11vw,4.5rem);line-height:.95;margin:0 0 .6rem}
h1 span{color:var(--flare);font-style:italic;font-weight:400}
p{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 1.6rem}
a{color:var(--ink);border-bottom:2px solid var(--flare);text-decoration:none;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;padding-bottom:2px}
</style>
</head>
<body>
<main>
  <h1>That card isn't <span>in the deck</span></h1>
  <p>404 &middot; nothing here to read</p>
  <a href="/">Cut the deck again</a>
</main>
</body>
</html>
